name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # One fixed signing key, created on the very first run and committed, so every
      # later APK installs as an update and keeps the leads on the phone.
      - name: Create signing key (first run only)
        run: |
          if [ ! -f keystore/dialer.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/dialer.jks -storetype PKCS12 \
              -alias dialer -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass leaddialer -keypass leaddialer -dname "CN=Lead Dialer"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/dialer.jks
            git commit -m "Add signing key [skip ci]"
            git push
          fi

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LeadDialer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LeadDialer
          path: LeadDialer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lead Dialer 1.0.${{ github.run_number }}
          files: LeadDialer.apk
